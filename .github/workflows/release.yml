name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
          - runner: ubuntu-24.04
            target: linux-x64
            # Static musl build: a glibc build only runs on distros at
            # least as new as the runner (Proxmox/Debian 12 is not).
            rust_target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The tag, Cargo.toml, apps/tui/package.json and the TUI's VERSION
      # constant must agree: a release whose binary reports an older
      # version would offer itself as an update forever.
      - name: Check version consistency
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          cargo="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          pkg="$(node -p 'require("./apps/tui/package.json").version')"
          ts="$(sed -n "s/^export const VERSION = '\(.*\)';/\1/p" apps/tui/src/version.ts)"
          echo "tag=$tag cargo=$cargo package.json=$pkg version.ts=$ts"
          [ "$tag" = "$cargo" ] && [ "$tag" = "$pkg" ] && [ "$tag" = "$ts" ] \
            || { echo "::error::version mismatch — bump every copy before tagging"; exit 1; }

      - name: Build core (release)
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
            rustup target add ${{ matrix.rust_target }}
            cargo build --release --target ${{ matrix.rust_target }}
            echo "CORE_DIR=target/${{ matrix.rust_target }}/release" >> "$GITHUB_ENV"
          else
            cargo build --release
            echo "CORE_DIR=target/release" >> "$GITHUB_ENV"
          fi

      - name: Bundle TUI
        run: |
          pnpm install --frozen-lockfile
          cd apps/tui
          node scripts/bundle.mjs

      - name: Assemble tarball
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          stage="mix2-${version}-${{ matrix.target }}"
          mkdir -p "dist/$stage"
          cp "${CORE_DIR}/mix2-core" "dist/$stage/"
          cp "${CORE_DIR}/mix2-consult" "dist/$stage/"
          cp apps/tui/dist/mix2.bundle.mjs "dist/$stage/"
          cp scripts/mix2-launcher.sh "dist/$stage/mix2"
          chmod +x "dist/$stage/mix2" "dist/$stage/mix2-core" "dist/$stage/mix2-consult"
          cp LICENSE README.md "dist/$stage/"
          tar -czf "dist/mix2-${{ matrix.target }}.tar.gz" -C dist "$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: mix2-${{ matrix.target }}
          path: dist/mix2-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # Checkout first: it cleans the workspace, so it must not run after
      # the artifacts have been downloaded into it. Needed for install.sh,
      # which ships with every release so `mix2 update` runs the installer
      # matching the release it installs.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum mix2-*.tar.gz > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/mix2-*.tar.gz
            dist/checksums.txt
            install.sh
          # A tag like v0.5.0-rc1 must not become "latest": every install
          # would be prompted to update to a release candidate.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

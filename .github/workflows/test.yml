name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # bubblewrap backs the Linux sandbox engine; installing it means the
      # behavioral denial matrix (`#[cfg(target_os = "linux")]`) actually
      # runs on the GitHub VM runners (which permit unprivileged user
      # namespaces) instead of silently skipping.
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # `pnpm check` runs the TUI suite, the Rust unit + integration tests
      # (including the OS-sandbox behavioral matrices), clippy, and fmt.
      - name: Check
        run: pnpm check

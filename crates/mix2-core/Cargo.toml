[package]
name = "mix2-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "mix2 runtime: agent orchestration core (internal binary, not user-facing)"

[[bin]]
name = "mix2-core"
path = "src/main.rs"

[[bin]]
name = "mix2-consult"
path = "src/bin/mix2_consult.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "io-std",
  "net",
  "sync",
  "time",
  "fs",
  "signal",
] }
tokio-util = "0.7"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
